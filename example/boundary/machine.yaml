codegen:
  context:
    golang: context.Context
    typescript: unknown
  golang:
    package: boundary
    imports:
      - path: "context"
actions:
  values:
    - name: Next
states:
  values:
    - name: A
      actions:
        - action: Next
          transitions:
            - destination: B
      enter: OnEnterA
      exit: OnExitA
    - name: B
      actions:
        - action: Next
          transitions:
            - destination: C
      enter: OnEnterB
      exit: OnExitB
    - name: C
      actions:
        - action: Next
          transitions:
            - destination: A
      enter: OnEnterC
      exit: OnExitC
