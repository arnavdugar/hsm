codegen:
  golang:
    package: queue
actions:
  values:
    - name: PushElement
      data_type:
        golang: QueueElement
        typescript: 'Record<string, never>'
    - name: ConsumeElement
    - name: Close
states:
  values:
    - name: Empty 
      symbol: StateQueueEmpty
      actions:
        - action: PushElement
          transitions:
            - transition: HandlePushElement
              destination: HasElements
        - action: Close
          transitions:
            - transition: HandleClose
              destination: Closed
    - name: HasElements
      symbol: StateQueueHasElements
      actions:
        - action: PushElement
          transitions:
            - transition: HandlePushElement
              destination: HasElements
        - action: ConsumeElement
          transitions:
            - transition: HandleConsumeElement
              destination: Empty
              guard: HasSingleElement
            - transition: HandleConsumeElement
              destination: HasElements
    - name: Closed
      symbol: StateClosed
