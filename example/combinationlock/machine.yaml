codegen:
  golang:
    package: combinationlock
actions:
  values:
    - name: Digit
      data_type:
        golang: int
        typescript: number
    - name: Lock
states:
  values:
    - name: Locked
      actions:
        - action: Digit
          transitions:
            - destination: FirstDigit
              guard: IsFirstDigit
            - destination: Locked
    - name: FirstDigit
      actions:
        - action: Digit
          transitions:
            - destination: SecondDigit
              guard: IsSecondDigit
            - destination: Locked
    - name: SecondDigit
      actions:
        - action: Digit
          transitions:
            - destination: Unlocked
              guard: IsThirdDigit
            - destination: Locked
    - name: Unlocked
      actions:
        - action: Lock
          transitions:
            - destination: Locked
